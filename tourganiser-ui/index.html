<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="/logo.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#000000" />
		<meta name="description" content="Tournament organisation and management service" />
		<link rel="apple-touch-icon" href="/logo192.png" />
		<link rel="manifest" href="/manifest.json" />
		<title>Tourganiser - Tournament Organisation and Management</title>
	</head>
	<body>
		<!-- Sets the theme before the first paint, so a dark-mode reader never sees
		     the light page while the bundle loads. ThemeProvider reads the class
		     this leaves on <body>; keep the two in step (see src/ThemeProvider.jsx). -->
		<script>
			(function () {
				var theme = null;
				try {
					theme = localStorage.getItem('theme');
				} catch (e) {}
				if (theme !== 'light' && theme !== 'dark') {
					theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
				}
				document.body.classList.add(theme);
			})();
		</script>
		<noscript>You need to enable JavaScript to run this app.</noscript>
		<div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
	</body>
	<style>
		.tournament-info-banner::before {
			content: '';
			position: absolute;
			top: 0;
			left: 50%;
			right: 0;
			bottom: 0;
			background-image: var(--banner-image);
			background-size: cover;
			background-position: center;
			opacity: 0.7;
			transform: scale(1.1);
			transition: transform 0.3s ease-out;
			z-index: 0;
		}
	</style>
</html>
